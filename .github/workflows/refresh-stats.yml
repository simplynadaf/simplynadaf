name: Refresh profile stats

on:
  schedule:
    - cron: '17 4 * * *'   # daily at 04:17 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make fontface available to generator
        run: cp scripts/fontface.css /tmp/fontface.css

      - name: Regenerate stats + contribution city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DEVTO_USER: sarvar_04
          # Views + followers aren't in the public Dev.to API — update these from your dashboard.
          DEVTO_VIEWS: "285938"
          DEVTO_FOLLOWERS: "34727"
        run: node scripts/generate.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          else
            echo "No changes."
          fi
